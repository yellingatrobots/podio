[[stage]]
name = "highpass"
f = 80

[[stage]]
name = "afftdn"
enabled = false
noise_floor_db = "floor"
reduction_db = 12

[[stage]]
name = "rnnoise"
enabled = false
model = "lq"

[[stage]]
name = "gate"
enabled = false
threshold_db = "floor+12"
