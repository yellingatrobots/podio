release_ms = 250

[[stage]]
name = "eq"
enabled = false
bands = []

[[stage]]
name = "compressor"
threshold_db = -18
ratio = 3
attack_ms = 5
release_ms = 60

[[stage]]
name = "deesser"
intensity = 0.4
frequency = 0.5
max_reduction = 0.5
